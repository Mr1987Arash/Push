<!doctype html>
<html lang="fa">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Spectrum Viewer</title>
  <style>
    body { font-family: sans-serif; margin: 0; padding: 0; background:#111; color:#eee }
    #canvas { width:100%; height:300px; background:#000; display:block }
    .controls { padding:10px }
  </style>
</head>
<body>
  <div class="controls">
    <button id="connect">ارتباط</button>
    <span id="status">خاموش</span>
  </div>
  <canvas id="canvas"></canvas>
  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    function resize(){ canvas.width = window.innerWidth; canvas.height = 300 }
    window.addEventListener('resize', resize); resize();

    let ws;
    document.getElementById('connect').onclick = () => {
      if(ws && ws.readyState === WebSocket.OPEN){ ws.close(); return }
      const url = (location.hostname === '' || location.hostname === 'localhost') ? 'ws://localhost:8000/ws/spectrum' : `ws://${location.hostname}:8000/ws/spectrum`;
      ws = new WebSocket(url);
      ws.onopen = () => { document.getElementById('status').innerText = 'متصل' }
      ws.onclose = () => { document.getElementById('status').innerText = 'قطع' }
      ws.onmessage = evt => {
        const msg = JSON.parse(evt.data);
        const arr = msg.spectrum;
        drawSpectrum(arr);
      }
    }

    function drawSpectrum(arr){
      const canvasWidth = canvas.width; const canvasHeight = canvas.height;
      const len = arr.length;
      const barWidth = Math.max(1, Math.floor(canvasWidth / len));
      for(let i=0;i<len;i++){
        const x = i*barWidth;
        const val = arr[i];
        const y = Math.floor((1 - val) * canvasHeight);
        ctx.fillStyle = `hsl(${Math.floor(val*240)},100%,50%)`;
        ctx.fillRect(x, y, barWidth, canvasHeight - y);
      }
    }
  </script>
</body>
</html>
