name: ci
on:
  push:
    branches: [ feature/redis-alembic ]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          cd backend
          pip install -r requirements.txt
      - name: quick import check
        run: |
          python -c "import fastapi; import sqlalchemy; import redis; import alembic; print('imports ok')"
